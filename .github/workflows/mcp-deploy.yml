name: Deploy MCP Server

on:
  push:
    branches:
      - main
      - 'feat/*'
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'terraform/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mcp-deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TERRAFORM_VERSION: 1.7.0
  NODE_VERSION: 18
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ENVIRONMENT: prod

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: prod
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build application
        run: npm run build

      - name: Package Lambda artifact
        run: |
          rm -rf terraform/lambda-deploy terraform/lambda-deployment.zip
          mkdir -p terraform/lambda-deploy
          cp package.json package-lock.json terraform/lambda-deploy/
          cp -R dist terraform/lambda-deploy/
          npm ci --ignore-scripts --omit=dev --prefix terraform/lambda-deploy
          cd terraform/lambda-deploy
          zip -qr ../lambda-deployment.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.GH_ACTION_ROLE_ARN }} 
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-mcp-prod

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend-config=backend/config.prod.hcl

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var-file="tfvars/prod.tfvars" \
            -var="lambda_package_path=lambda-deployment.zip" \
            -var="region=${{ env.AWS_REGION }}" \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Outputs
        id: outputs
        working-directory: terraform
        run: |
          echo "mcp_endpoint=$(terraform output -raw mcp_endpoint)" >> $GITHUB_OUTPUT
          echo "function_name=$(terraform output -raw function_name)" >> $GITHUB_OUTPUT

      - name: Test Endpoint
        run: |
          sleep 5
          curl -f -X POST ${{ steps.outputs.outputs.mcp_endpoint }} \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'

      - name: Deployment Summary
        run: |
          echo "## 🎉 Deployed to Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**MCP Endpoint:** ${{ steps.outputs.outputs.mcp_endpoint }}" >> $GITHUB_STEP_SUMMARY
          echo "**Function:** ${{ steps.outputs.outputs.function_name }}" >> $GITHUB_STEP_SUMMARY
