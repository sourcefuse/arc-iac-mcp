name: Destroy MCP Server

on:
  push:
    branches:
      - feat/arc-mcp

permissions:
  id-token: write
  contents: read

env:
  TERRAFORM_VERSION: 1.7.0
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ENVIRONMENT: prod

jobs:
  destroy:
    name: Destroy Production Infrastructure
    runs-on: ubuntu-latest
    environment: prod
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.GH_ACTION_ROLE_ARN }} 
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-mcp-destroy

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend-config=backend/config.prod.hcl

      - name: Terraform Destroy
        working-directory: terraform
        run: |
          terraform destroy -auto-approve \
            -var-file="tfvars/prod.tfvars" \
            -var="lambda_package_path=lambda-deployment.zip" \
            -var="region=${{ env.AWS_REGION }}" \
            -var="environment=${{ env.ENVIRONMENT }}"
